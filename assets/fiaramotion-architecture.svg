<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#0e172a" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="850" height="480" rx="16" fill="url(#archBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Title & Subtitle -->
  <g transform="translate(36, 40)">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#ffffff">Architecture Technique Système – FIARAmotion</text>
    <text y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="12" fill="#94a3b8">Conception Full Stack Découplée &amp; PWA Multiplateforme • Stage CERES</text>
  </g>

  <!-- LAYER 1: CLIENT TIER (FRONTEND PWA) -->
  <g transform="translate(36, 100)">
    <rect width="230" height="320" rx="14" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="2" />
    <rect x="0" y="0" width="230" height="44" rx="14" fill="#1e293b" />
    <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#38bdf8">1. TIER CLIENT (PWA)</text>

    <!-- Sub-boxes -->
    <g transform="translate(16, 60)" font-family="'JetBrains Mono', monospace" font-size="11">
      <rect width="198" height="44" rx="8" fill="#0b1120" stroke="#334155" />
      <text x="14" y="22" fill="#ffffff" font-weight="600">React.js 18 + TS</text>
      <text x="14" y="36" fill="#64748b" font-size="9.5">SPA modulaire &amp; typée</text>

      <rect y="54" width="198" height="44" rx="8" fill="#0b1120" stroke="#334155" />
      <text x="14" y="76" fill="#ffffff" font-weight="600">Service Worker &amp; PWA</text>
      <text x="14" y="90" fill="#64748b" font-size="9.5">Mise en cache &amp; mode terrain</text>

      <rect y="108" width="198" height="44" rx="8" fill="#0b1120" stroke="#334155" />
      <text x="14" y="130" fill="#ffffff" font-weight="600">Tailwind CSS + UI</text>
      <text x="14" y="144" fill="#64748b" font-size="9.5">Design responsive mobile/desktop</text>

      <rect y="162" width="198" height="44" rx="8" fill="#0b1120" stroke="#334155" />
      <text x="14" y="184" fill="#ffffff" font-weight="600">State Management</text>
      <text x="14" y="198" fill="#64748b" font-size="9.5">Gestion des sessions &amp; 5 rôles</text>
    </g>
  </g>

  <!-- Connectors from Client to API -->
  <g stroke="url(#blueLine)" stroke-width="2.5" stroke-dasharray="6 4">
    <line x1="266" y1="210" x2="310" y2="210" />
    <line x1="266" y1="280" x2="310" y2="280" />
  </g>
  <text x="288" y="195" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">HTTPS</text>
  <text x="288" y="300" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">JSON/REST</text>

  <!-- LAYER 2: BACKEND APPLICATION TIER -->
  <g transform="translate(310, 100)">
    <rect width="230" height="320" rx="14" fill="url(#boxGrad)" stroke="#2563eb" stroke-width="2" />
    <rect x="0" y="0" width="230" height="44" rx="14" fill="#1e293b" />
    <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#60a5fa">2. API BACKEND (Flask)</text>

    <!-- Sub-boxes -->
    <g transform="translate(16, 60)" font-family="'JetBrains Mono', monospace" font-size="11">
      <rect width="198" height="44" rx="8" fill="#0b1120" stroke="#334155" />
      <text x="14" y="22" fill="#ffffff" font-weight="600">Python / Flask Core</text>
      <text x="14" y="36" fill="#64748b" font-size="9.5">Routage REST &amp; Middlewares</text>

      <rect y="54" width="198" height="44" rx="8" fill="#0b1120" stroke="#334155" />
      <text x="14" y="76" fill="#ffffff" font-weight="600">Contrôle d'Accès RBAC</text>
      <text x="14" y="90" fill="#64748b" font-size="9.5">JWT &amp; 5 Rôles métier CERES</text>

      <rect y="108" width="198" height="44" rx="8" fill="#0b1120" stroke="#334155" />
      <text x="14" y="130" fill="#ffffff" font-weight="600">Moteur Opérationnel</text>
      <text x="14" y="144" fill="#64748b" font-size="9.5">Missions, alertes, carburant</text>

      <rect y="162" width="198" height="44" rx="8" fill="#0b1120" stroke="#334155" />
      <text x="14" y="184" fill="#ffffff" font-weight="600">ORM &amp; Services Data</text>
      <text x="14" y="198" fill="#64748b" font-size="9.5">Validation &amp; calculs financiers</text>
    </g>
  </g>

  <!-- Connectors from API to DB -->
  <g stroke="url(#blueLine)" stroke-width="2.5" stroke-dasharray="6 4">
    <line x1="540" y1="210" x2="584" y2="210" />
    <line x1="540" y1="280" x2="584" y2="280" />
  </g>
  <text x="562" y="195" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">SQL</text>
  <text x="562" y="300" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">Pool conn.</text>

  <!-- LAYER 3: DATA & STORAGE TIER -->
  <g transform="translate(584, 100)">
    <rect width="230" height="320" rx="14" fill="url(#boxGrad)" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="230" height="44" rx="14" fill="#1e293b" />
    <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#34d399">3. PERSISTANCE &amp; SÉCURITÉ</text>

    <!-- Sub-boxes -->
    <g transform="translate(16, 60)" font-family="'JetBrains Mono', monospace" font-size="11">
      <rect width="198" height="44" rx="8" fill="#0b1120" stroke="#334155" />
      <text x="14" y="22" fill="#ffffff" font-weight="600">PostgreSQL Database</text>
      <text x="14" y="36" fill="#64748b" font-size="9.5">Schémas relationnels normalisés</text>

      <rect y="54" width="198" height="44" rx="8" fill="#0b1120" stroke="#334155" />
      <text x="14" y="76" fill="#ffffff" font-weight="600">Historisation &amp; Audit</text>
      <text x="14" y="90" fill="#64748b" font-size="9.5">Traçabilité complète des missions</text>

      <rect y="108" width="198" height="44" rx="8" fill="#0b1120" stroke="#334155" />
      <text x="14" y="130" fill="#ffffff" font-weight="600">Intégrité &amp; Sauvegardes</text>
      <text x="14" y="144" fill="#64748b" font-size="9.5">Clés étrangères, index &amp; dumps</text>

      <rect y="162" width="198" height="44" rx="8" fill="#0b1120" stroke="#334155" />
      <text x="14" y="184" fill="#ffffff" font-weight="600">Sécurité &amp; Rôles SQL</text>
      <text x="14" y="198" fill="#64748b" font-size="9.5">Chiffrement des mots de passe</text>
    </g>
  </g>

  <!-- Bottom Legend -->
  <g transform="translate(36, 440)" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">
    <circle cx="6" cy="6" r="4" fill="#38bdf8" />
    <text x="16" y="10">PWA multi-supports</text>

    <circle cx="160" cy="6" r="4" fill="#2563eb" />
    <text x="170" y="10">API REST modulaire</text>

    <circle cx="310" cy="6" r="4" fill="#10b981" />
    <text x="320" y="10">Base ACID Robuste</text>

    <text x="560" y="10" font-family="'JetBrains Mono', monospace" fill="#64748b">Conçu pour le CERES • 2026</text>
  </g>
</svg>
