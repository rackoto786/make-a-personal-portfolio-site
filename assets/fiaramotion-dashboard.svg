<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0e172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15213b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="900" height="550" rx="16" fill="url(#dbBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Sidebar Nav -->
  <rect x="0" y="0" width="210" height="550" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  
  <!-- Logo / Brand -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="url(#blueGlow)" />
    <path d="M 8 18 L 14 10 L 22 10 L 26 18 L 8 18 Z" fill="#ffffff" />
    <circle cx="11" cy="22" r="3" fill="#ffffff" />
    <circle cx="23" cy="22" r="3" fill="#ffffff" />
    <text x="44" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#ffffff" letter-spacing="0.5">FIARA<tspan fill="#38bdf8">motion</tspan></text>
    <text x="44" y="33" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="9" fill="#64748b">CERES Fleet Management</text>
  </g>

  <!-- Sidebar Nav Items -->
  <g transform="translate(16, 95)" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">
    <!-- Active Item: Tableau de bord -->
    <rect x="0" y="0" width="178" height="36" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#38bdf8" />
    <text x="34" y="22" fill="#38bdf8">Tableau de bord</text>

    <!-- Item: Véhicules -->
    <text x="34" y="62" fill="#94a3b8">Véhicules (Flotte)</text>
    <!-- Item: Conducteurs -->
    <text x="34" y="100" fill="#94a3b8">Conducteurs</text>
    <!-- Item: Missions & Trajets -->
    <text x="34" y="138" fill="#94a3b8">Missions & Trajets</text>
    <!-- Item: Planification -->
    <text x="34" y="176" fill="#94a3b8">Planification</text>
    <!-- Item: Maintenance & Entretien -->
    <text x="34" y="214" fill="#94a3b8">Maintenance & SAV</text>
    <!-- Item: Carburant & Coûts -->
    <text x="34" y="252" fill="#94a3b8">Gestion Carburant</text>
    <!-- Item: Supervision Live -->
    <text x="34" y="290" fill="#94a3b8">Supervision Directe</text>
    <!-- Item: Utilisateurs & Rôles -->
    <text x="34" y="328" fill="#94a3b8">Rôles & Paramètres</text>
  </g>

  <!-- Top App Bar -->
  <g transform="translate(230, 20)">
    <rect x="0" y="0" width="645" height="48" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="29" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Pilotage Opérationnel &amp; Financier</text>
    <rect x="360" y="10" width="140" height="28" rx="6" fill="#1e293b" />
    <text x="375" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Rôle : Direction</text>
    <rect x="515" y="10" width="115" height="28" rx="6" fill="#2563eb" />
    <text x="532" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff">+ Nouvelle Mission</text>
  </g>

  <!-- KPI Cards Row -->
  <g transform="translate(230, 85)">
    <!-- KPI 1: Flotte Active -->
    <rect x="0" y="0" width="150" height="90" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Véhicules Actifs</text>
    <text x="16" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800" fill="#ffffff">42 <tspan font-size="13" font-weight="500" fill="#38bdf8">/ 45</tspan></text>
    <text x="16" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#10b981">● 93.3% Disponibilité</text>

    <!-- KPI 2: Missions en cours -->
    <rect x="165" y="0" width="150" height="90" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="181" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Missions en cours</text>
    <text x="181" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800" fill="#38bdf8">18</text>
    <text x="181" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">12 planifiées demain</text>

    <!-- KPI 3: Conso Carburant -->
    <rect x="330" y="0" width="150" height="90" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="346" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Indicateur Carburant</text>
    <text x="346" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#ffffff">8.4 <tspan font-size="12" font-weight="500" fill="#94a3b8">L/100km</tspan></text>
    <text x="346" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#10b981">↓ -12% vs mois préc.</text>

    <!-- KPI 4: Maintenance -->
    <rect x="495" y="0" width="150" height="90" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="511" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8">Entretiens à prévoir</text>
    <text x="511" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800" fill="#f59e0b">3</text>
    <text x="511" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#f59e0b">● 1 vidange urgente</text>
  </g>

  <!-- Main Chart & Live Operations View -->
  <g transform="translate(230, 195)">
    <!-- Operational Flow Chart -->
    <rect x="0" y="0" width="415" height="210" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Suivi Hebdomadaire des Kilomètres &amp; Carburant</text>
    <text x="20" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#64748b">Données consolidées multi-sites CERES</text>
    
    <!-- Grid lines -->
    <line x1="20" y1="80" x2="395" y2="80" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="20" y1="120" x2="395" y2="120" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="20" y1="160" x2="395" y2="160" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Chart Line -->
    <polyline points="30,150 90,130 150,145 210,95 270,110 330,70 380,85" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="30,170 90,160 150,155 210,135 270,140 330,115 380,120" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" />
    
    <circle cx="210" cy="95" r="5" fill="#00d2ff" stroke="#ffffff" stroke-width="2" />
    <circle cx="330" cy="70" r="5" fill="#00d2ff" stroke="#ffffff" stroke-width="2" />

    <!-- X Axis labels -->
    <text x="28" y="185" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">LUN</text>
    <text x="88" y="185" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">MAR</text>
    <text x="148" y="185" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">MER</text>
    <text x="208" y="185" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">JEU</text>
    <text x="268" y="185" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">VEN</text>
    <text x="328" y="185" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">SAM</text>
    <text x="375" y="185" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">DIM</text>
  </g>

  <!-- Real-time Mission Status Card -->
  <g transform="translate(660, 195)">
    <rect x="0" y="0" width="215" height="210" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Missions Récentes</text>
    
    <!-- Mission 1 -->
    <rect x="12" y="44" width="191" height="42" rx="8" fill="#0b1120" />
    <circle cx="26" cy="65" r="4" fill="#10b981" />
    <text x="38" y="59" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Toyota Hilux #04</text>
    <text x="38" y="73" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#64748b">M. Rasoanaivo • En route</text>

    <!-- Mission 2 -->
    <rect x="12" y="94" width="191" height="42" rx="8" fill="#0b1120" />
    <circle cx="26" cy="115" r="4" fill="#38bdf8" />
    <text x="38" y="109" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Renault Duster #11</text>
    <text x="38" y="123" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#64748b">M. Randria • Arrivé site</text>

    <!-- Mission 3 -->
    <rect x="12" y="144" width="191" height="42" rx="8" fill="#0b1120" />
    <circle cx="26" cy="165" r="4" fill="#f59e0b" />
    <text x="38" y="159" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Peugeot Partner #02</text>
    <text x="38" y="173" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#64748b">Chargée technique • Contrôle</text>
  </g>

  <!-- PWA & Tech Architecture Bar at Bottom -->
  <g transform="translate(230, 420)">
    <rect x="0" y="0" width="645" height="105" rx="12" fill="#0b1224" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">ARCHITECTURE FULL STACK CERES</text>
    
    <g transform="translate(20, 40)" font-family="'JetBrains Mono', monospace" font-size="10.5">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="135" height="36" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="14" y="22" fill="#e2e8f0">React + TS (PWA)</text>

      <!-- Arrow -->
      <text x="146" y="22" fill="#38bdf8" font-size="14">→</text>

      <!-- Badge 2 -->
      <rect x="170" y="0" width="130" height="36" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="184" y="22" fill="#e2e8f0">Python / Flask API</text>

      <!-- Arrow -->
      <text x="310" y="22" fill="#38bdf8" font-size="14">→</text>

      <!-- Badge 3 -->
      <rect x="330" y="0" width="125" height="36" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="344" y="22" fill="#e2e8f0">PostgreSQL DB</text>

      <!-- Badge 4 -->
      <rect x="475" y="0" width="130" height="36" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="490" y="22" fill="#10b981">Multi-rôles (5)</text>
    </g>

    <text x="20" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748b">
      Illustration vectorielle schématique • Conçue par Narindra Rackoto pour le programme CERES (Stage Master ENI).
    </text>
  </g>
</svg>
